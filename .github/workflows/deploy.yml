name: Deploy Hugo site to Pages

on:
  # Déploiement sur chaque push (corrections SEO, contenu manuel…)
  push:
    branches: [main]
  # Filet quotidien : la CTI est committée par sync-cti.yml à 08:00 UTC (bot),
  # ce qui NE redéclenche pas de workflow → on redéploie à 08:20 UTC pour la publier.
  schedule:
    - cron: '20 8 * * *'
  workflow_dispatch:

# Permissions nécessaires au déploiement GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois (pas d'annulation d'un déploiement en cours)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.161.0
      HUGO_ENVIRONMENT: production
      HUGO_ENV: production
      TZ: Europe/Paris
    steps:
      - name: Install Hugo CLI (extended)
        run: |
          wget -O "${{ runner.temp }}/hugo.deb" \
            "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb"
          sudo dpkg -i "${{ runner.temp }}/hugo.deb"
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Go (modules Hugo / Hinode)
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Node dependencies
        run: npm ci
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Hugo
        run: hugo --minify --gc
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
