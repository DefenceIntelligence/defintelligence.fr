name: Sync CTI Digest

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch digest
        run: |
          curl -fsSL \
            https://raw.githubusercontent.com/DefenceIntelligence/CTIDigest/main/digest.md \
            -o /tmp/digest_raw.md

      - name: Generate dated file
        run: |
          DATE=$(date -u +%Y-%m-%d)
          TITLE_DATE=$(python3 -c "
          from datetime import datetime, timezone
          now = datetime.now(timezone.utc)
          months = ['','janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre']
          print(f'{now.day} {months[now.month]} {now.year}')
          ")

          mkdir -p content/cti
          OUTFILE="content/cti/${DATE}.md"

          printf '%s\n' \
            '---' \
            "title: \"CTI Digest — ${TITLE_DATE}\"" \
            "description: \"Veille cybersécurité du ${TITLE_DATE} : vulnérabilités critiques (CVE), campagnes actives et ransomware analysés par Defence Intelligence.\"" \
            "date: ${DATE}" \
            'tags: ["cti", "veille", "threat-intelligence"]' \
            '---' \
            '' > "$OUTFILE"

          # Strip the first H1 du digest (titre redondant avec le titre Hugo)
          sed '0,/^#[[:space:]]/{/^#[[:space:]]/d}' /tmp/digest_raw.md >> "$OUTFILE"
          echo "Written: $OUTFILE"

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/cti/
          if git diff --cached --quiet; then
            echo "Digest inchangé, rien à committer."
            exit 0
          fi
          git commit -m "chore: CTI digest $(date -u +%Y-%m-%d)"
          git push
