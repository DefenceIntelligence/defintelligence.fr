theme = "dark"
colorTheme = ""

description = "Conseil et expertise en cybersécurité — audit, pentest, formation et accompagnement stratégique."
author = "Defence Intelligence"
organization = "Defence Intelligence"
copyright = "Defence Intelligence"

[navigation]
  anchor = true
  logo = ""
  color = "body"
  fixed = true
  offset = "5em"

[main]
  separator = false
  endorCTA = true
  favicon = "img/favicon.png"
  customCSS = ["css/brand.css"]

[home]
  sections = ["blog"]
  fullCover = true
  centerHeadline = false
  style = ""

[style]
  primary = "#00c97a"
  secondary = "#6c757d"
  success = "#198754"
  info = "#0dcaf0"
  warning = "#ffc107"
  danger = "#dc3545"
  light = "#f8f9fa"
  dark = "#212529"

[footer]
  license = "none"

[sharing]
  enabled = true
  sort = "weight"
  reverse = false
  webshare = true

[[sharing.providers]]
  name = "LinkedIn"
  url = "https://www.linkedin.com/sharing/share-offsite/?url={url}"
  icon = "fab linkedin"
  weight = 10

[[sharing.providers]]
  name = "Email"
  url = "mailto:?subject={title}&body={url}"
  icon = "fas envelope"
  weight = 30

[docs]
  github = "https://github.com/DefenceIntelligence/defintelligence.fr"
  release = ""
  checkVersion = false

[schema]
  type = "Organization"
  name = "Defence Intelligence"
  locale = "fr-FR"
  github = "https://github.com/DefenceIntelligence"
  email = "defintelligence@proton.me"
