[build]
  publish = "public"
  command = "npm ci && curl -fsSL https://github.com/gohugoio/hugo/releases/download/v0.161.0/hugo_extended_0.161.0_linux-amd64.tar.gz | tar xz && ./hugo --minify"

[build.environment]
  HUGO_VERSION = "0.161.0"
  HUGO_ENVIRONMENT = "production"
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/contact"
  to = "/contact/"
  status = 301

[context.deploy-preview]
  command = "npm ci && curl -fsSL https://github.com/gohugoio/hugo/releases/download/v0.161.0/hugo_extended_0.161.0_linux-amd64.tar.gz | tar xz && ./hugo --minify --buildFuture -b $DEPLOY_PRIME_URL"
