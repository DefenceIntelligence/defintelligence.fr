{{ define "main" }}
<article class="max-w-2xl mx-auto">
  <header class="mb-8">
    <h1 class="text-3xl font-bold text-neutral-100">{{ .Title }}</h1>
    <p class="text-neutral-400 mt-2">Décrivez votre projet ou votre besoin, nous vous répondons sous 48h.</p>
  </header>

  <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field" class="space-y-6">
    <input type="hidden" name="form-name" value="contact" />
    <p class="hidden">
      <label>Ne pas remplir : <input name="bot-field" /></label>
    </p>

    <div>
      <label class="block text-sm font-medium text-neutral-300 mb-1" for="name">Nom / Société</label>
      <input type="text" id="name" name="name" required
        class="w-full px-4 py-2 bg-neutral-800 border border-neutral-600 rounded-lg text-neutral-100 focus:outline-none focus:border-primary-500 transition" />
    </div>

    <div>
      <label class="block text-sm font-medium text-neutral-300 mb-1" for="email">Email</label>
      <input type="email" id="email" name="email" required
        class="w-full px-4 py-2 bg-neutral-800 border border-neutral-600 rounded-lg text-neutral-100 focus:outline-none focus:border-primary-500 transition" />
    </div>

    <div>
      <label class="block text-sm font-medium text-neutral-300 mb-1" for="subject">Sujet</label>
      <select id="subject" name="subject"
        class="w-full px-4 py-2 bg-neutral-800 border border-neutral-600 rounded-lg text-neutral-100 focus:outline-none focus:border-primary-500 transition">
        <option value="audit">Audit / Pentest</option>
        <option value="risques">Gestion des risques</option>
        <option value="formation">Formation</option>
        <option value="rssi">RSSI externalisé</option>
        <option value="argos">Démo ARGOS</option>
        <option value="autre">Autre</option>
      </select>
    </div>

    <div>
      <label class="block text-sm font-medium text-neutral-300 mb-1" for="message">Message</label>
      <textarea id="message" name="message" rows="5" required
        class="w-full px-4 py-2 bg-neutral-800 border border-neutral-600 rounded-lg text-neutral-100 focus:outline-none focus:border-primary-500 transition resize-none"></textarea>
    </div>

    <button type="submit"
      class="w-full py-3 bg-primary-600 hover:bg-primary-500 text-white font-semibold rounded-lg transition">
      Envoyer le message
    </button>
  </form>

  <div class="mt-10 pt-8 border-t border-neutral-700 text-neutral-400 text-sm space-y-2">
    <p>📧 <a href="mailto:contact@defintelligence.fr" class="hover:text-primary-400">contact@defintelligence.fr</a></p>
    <p>🔒 Vos données ne sont pas utilisées à des fins commerciales.</p>
  </div>
</article>
{{ end }}
