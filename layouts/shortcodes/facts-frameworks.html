{{/* facts-frameworks.html — Grille de frameworks depuis data/facts.yml */}}
{{ $f := hugo.Data.facts.frameworks }}
<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.75rem;margin:1.2rem 0">
  <div style="padding:1rem;border:1px solid var(--bs-border-color);border-radius:.5rem;font-size:.9rem">
    <strong>Normes</strong><br/>{{ delimit $f.normes " · " }}
  </div>
  <div style="padding:1rem;border:1px solid var(--bs-border-color);border-radius:.5rem;font-size:.9rem">
    <strong>Méthodes risques</strong><br/>{{ delimit $f.risques " · " }}
  </div>
  <div style="padding:1rem;border:1px solid var(--bs-border-color);border-radius:.5rem;font-size:.9rem">
    <strong>Réglementaire</strong><br/>{{ delimit $f.reglementaire " · " }}
  </div>
  <div style="padding:1rem;border:1px solid var(--bs-border-color);border-radius:.5rem;font-size:.9rem">
    <strong>Langues</strong><br/>{{ delimit $f.langues " · " }}
  </div>
</div>
