{{/* facts-certifications.html — Table de certifications depuis data/facts.yml */}}
<table style="margin:1.2rem 0;border-collapse:collapse;width:100%">
{{ range hugo.Data.facts.certifications }}
  <tr>
    <td style="padding:.4rem .6rem;color:var(--bs-primary);font-size:1.1rem">✓</td>
    <td style="padding:.4rem .6rem">
      {{- .label -}}
      {{- if .organisme }} ({{ .organisme }}){{ end -}}
      {{- if .annee }}, {{ .annee }}{{ end -}}
    </td>
  </tr>
{{ end }}
</table>
